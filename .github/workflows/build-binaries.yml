name: Build Cross-Platform Binaries

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build (e.g., v0.5.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            suffix: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            suffix: ".exe"
          - os: macos-26-intel
            platform: macos
            arch: amd64
            suffix: ""
          - os: macos-26
            platform: macos
            arch: arm64
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache
          echo "ccache installed"
        shell: bash

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          echo "ccache installed"
        shell: bash

      - name: Sync dependencies
        run: uv sync

      - name: Build CLI binary
        run: uv run bash ./build_executable.sh cli
        shell: bash

      - name: Build macOS .pkg installer (CLI)
        if: runner.os == 'macOS'
        run: bash ./build_macos_pkg.sh
        shell: bash

      - name: Build GUI binary
        run: uv run bash ./build_executable.sh gui
        shell: bash

      - name: Verify binary architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Checking CLI binary architecture..."
          file dist/timeline2images || echo "CLI binary not found"
          echo ""
          echo "Checking GUI binary architecture..."
          file dist/timeline2images-gui || echo "GUI binary not found"
          echo ""
          echo "Expected for macos-13 (Intel): x86_64"
          echo "Expected for macos-14 (Apple Silicon): arm64"
        shell: bash

      - name: Extract version
        id: version
        run: |
          VERSION=$(uv run python -c "import sys; sys.path.insert(0, 'src'); from timeline_2_images import __version__; print(__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Rename CLI binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/timeline2images dist/timeline2images-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Rename GUI binary (Unix, non-macOS)
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: |
          mv dist/timeline2images-gui dist/timeline2images-gui-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Rename GUI app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          # On macOS with --mode=app, GUI builds create .app bundles
          if [ -d "dist/timeline2images-gui-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.app" ]; then
            echo "macOS GUI app bundle found - keeping as-is"
          elif [ -f "dist/timeline2images-gui" ]; then
            echo "macOS GUI binary found (fallback, converting to app name)"
            mv dist/timeline2images-gui dist/timeline2images-gui-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          fi

      - name: Rename CLI binary (Windows)
        if: runner.os == 'Windows'
        run: |
          move dist\timeline2images.exe dist\timeline2images-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.exe
        shell: cmd

      - name: Rename GUI binary (Windows)
        if: runner.os == 'Windows'
        run: |
          move dist\timeline2images-gui.exe dist\timeline2images-gui-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.exe
        shell: cmd

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        run: |
          # Copy binaries without version suffix for installer
          copy dist\timeline2images-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.exe dist\timeline2images.exe
          copy dist\timeline2images-gui-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.exe dist\timeline2images-gui.exe

          # Run Inno Setup compiler with version injected via /d flag
          $issFile = ".inno\timeline2images.iss"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /dAppVersion="${{ steps.version.outputs.VERSION }}" "$issFile"

          # Verify installer was created in .inno/dist/ and copy to dist/
          $installerSource = ".inno\dist\timeline2images-${{ steps.version.outputs.VERSION }}-windows-installer.exe"
          $installerDest = "dist\timeline2images-${{ steps.version.outputs.VERSION }}-windows-installer.exe"

          if (-Not (Test-Path $installerSource)) {
            Write-Error "Installer not found at $installerSource"
            exit 1
          }

          copy $installerSource $installerDest
          Write-Output "Installer created successfully at $installerDest"
        shell: pwsh

      - name: Generate checksums (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # On macOS, hash .pkg (CLI) and .zip (GUI) files if they exist
          rm -f CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256

          # Hash CLI .pkg files
          find timeline2images-*.pkg -maxdepth 0 -type f -exec sha256sum {} \; >> CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256 2>/dev/null || true

          # Hash GUI .zip files
          find timeline2images-gui-*.zip -maxdepth 0 -type f -exec sha256sum {} \; >> CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256 2>/dev/null || true

          # Show results
          if [ -s CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256 ]; then
            cat CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256
          else
            echo "Warning: No .pkg or .zip files found for checksums"
          fi

      - name: Generate checksums (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          # On Linux, hash all timeline2images files (bare binaries)
          find timeline2images-* -maxdepth 0 -type f -exec sha256sum {} \; > CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256
          cat CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          $files = @(Get-ChildItem -Filter "timeline2images-*" -Name)
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
            "$hash  $file" | Add-Content -Path "CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256"
          }
          Get-Content "CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256"
        shell: pwsh

      - name: Upload binaries to release (Windows)
        if: runner.os == 'Windows'
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "Uploading to release: $TAG_NAME"
          gh release upload "$TAG_NAME" \
            dist/timeline2images-${{ steps.version.outputs.VERSION }}-windows-amd64.exe \
            dist/timeline2images-gui-${{ steps.version.outputs.VERSION }}-windows-amd64.exe \
            dist/timeline2images-${{ steps.version.outputs.VERSION }}-windows-installer.exe \
            dist/CHECKSUMS-${{ matrix.platform }}-${{ matrix.arch }}.sha256 \
            --clobber
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare macOS artifacts (create zip for .app bundle)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # Zip the GUI app bundle if it exists
          if [ -d "timeline2images-gui-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.app" ]; then
            zip -r "timeline2images-gui-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.zip" "timeline2images-gui-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.app"
            rm -rf "timeline2images-gui-${{ steps.version.outputs.VERSION }}-macos-${{ matrix.arch }}.app"
          fi
          cd ..
        shell: bash

      - name: Upload binaries to release (macOS)
        if: runner.os == 'macOS'
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "Uploading macOS release: $TAG_NAME"

          cd dist
          # On macOS, distribute only:
          # - CLI: .pkg installer (no bare binary)
          # - GUI: .zip app bundle (no bare binary)
          # - CHECKSUMS: for verification
          FILES=""

          # Add CLI .pkg if exists
          if find timeline2images-*.pkg -maxdepth 0 -type f >/dev/null 2>&1; then
            FILES="$FILES $(find timeline2images-*.pkg -maxdepth 0 -type f)"
          fi

          # Add GUI .zip if exists
          if find timeline2images-gui-*.zip -maxdepth 0 -type f >/dev/null 2>&1; then
            FILES="$FILES $(find timeline2images-gui-*.zip -maxdepth 0 -type f)"
          fi

          # Always add checksums
          FILES="$FILES $(find CHECKSUMS-* -maxdepth 0 -type f 2>/dev/null || true)"

          # Trim whitespace
          FILES=$(echo $FILES | xargs)

          if [ -z "$FILES" ]; then
            echo "Error: No files found to upload"
            exit 1
          fi

          echo "Files to upload:"
          echo "$FILES"

          gh release upload "$TAG_NAME" $FILES --clobber
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to release (Linux)
        if: runner.os == 'Linux'
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.event.inputs.version }}"
          echo "Uploading Linux release: $TAG_NAME"

          cd dist
          # On Linux, distribute bare binaries and checksums
          FILES=$(find timeline2images-* CHECKSUMS-* -maxdepth 0 -type f 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "No files found to upload"
            exit 1
          fi

          gh release upload "$TAG_NAME" $FILES --clobber
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
